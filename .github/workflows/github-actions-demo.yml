name: Vue-GitHub-Actions CI
on: 
  push: 
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 拉代码
      - name: Check out code
        uses: actions/checkout@v5

      # 安装node
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.11.0

      # 安装依赖
      - name: Install dependencies
        run: pnpm install

      # 构建 Vue 项目
      - name: Build Vue Project
        run: pnpm run build

